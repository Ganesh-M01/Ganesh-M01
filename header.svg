<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220">
        <animate attributeName="stop-color" values="#0b1220;#0f1a33;#0b1220" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#16213e">
        <animate attributeName="stop-color" values="#16213e;#1b1b3f;#16213e" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="650" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="orbA">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="900" height="240" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="240" fill="url(#bg)"/>

    <!-- drifting glows -->
    <circle cx="170" cy="70" r="150" fill="url(#orbA)">
      <animateTransform attributeName="transform" type="translate" values="0 0;80 30;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="180" r="170" fill="url(#orbB)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-90 -30;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- heading -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" dur="1.2s" fill="freeze"/>
      <text x="450" y="133" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="url(#txt)" filter="url(#glow)">Hello World!</text>
    </g>

    <!-- accent line -->
    <rect x="450" y="165" width="0" height="3" rx="1.5" fill="url(#line)">
      <animate attributeName="x" from="450" to="330" begin="0.6s" dur="1.2s" fill="freeze"/>
      <animate attributeName="width" from="0" to="240" begin="0.6s" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- border -->
  <rect x="1" y="1" width="898" height="238" rx="17" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5">
    <animate attributeName="stroke-opacity" values="0.5;0.2;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
