<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b38" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#34437a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#9a8fbf"/>
    </linearGradient>

    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="300" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#f4f1ea"/>
      <stop offset="0.45" stop-color="#dfeaff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#dfeaff"/>
      <stop offset="1" stop-color="#f4f1ea"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="300 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <g id="fl">
      <path d="M0,0 Q2,-9 0,-18" stroke="#5f9a78" stroke-width="1.3" fill="none"/>
      <g fill="#a9c8ff">
        <circle cx="0" cy="-21" r="2.4"/>
        <circle cx="2.5" cy="-19" r="2.4"/>
        <circle cx="-2.5" cy="-19" r="2.4"/>
        <circle cx="1.6" cy="-16.4" r="2.4"/>
        <circle cx="-1.6" cy="-16.4" r="2.4"/>
      </g>
      <circle cx="0" cy="-18.8" r="1.4" fill="#fff6c9"/>
    </g>
  </defs>

  <rect width="900" height="180" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="40" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="22" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="52" r="1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.5s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- hills -->
  <path fill="#4a5a8c" d="M0,128 Q150,108 300,124 T600,120 T900,112 L900,180 L0,180Z"/>
  <path fill="#2f3b6c" d="M0,148 Q220,130 420,145 T900,136 L900,180 L0,180Z"/>
  <path fill="#1a2250" d="M0,168 Q250,154 500,166 T900,158 L900,180 L0,180Z"/>

  <!-- flowers -->
  <g>
    <g transform="translate(50 170) scale(1.1)"><g><animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="4s" begin="-1s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(130 176) scale(1.3)"><g><animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="4.6s" begin="-2s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(220 172)"><g><animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="5s" begin="-3s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(320 177) scale(1.2)"><g><animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="4.2s" begin="-0.5s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(430 173) scale(0.9)"><g><animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="5.4s" begin="-4s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(520 177) scale(1.3)"><g><animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="4.8s" begin="-1.5s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(620 172)"><g><animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="4.4s" begin="-2.5s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(710 177) scale(1.2)"><g><animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="5.2s" begin="-3.5s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(800 171) scale(0.9)"><g><animateTransform attributeName="transform" type="rotate" values="-5 0 0;5 0 0;-5 0 0" dur="4s" begin="-0.8s" repeatCount="indefinite"/><use href="#fl"/></g></g>
    <g transform="translate(865 176) scale(1.3)"><g><animateTransform attributeName="transform" type="rotate" values="-6 0 0;6 0 0;-6 0 0" dur="4.7s" begin="-2.2s" repeatCount="indefinite"/><use href="#fl"/></g></g>
  </g>

  <!-- floating motes -->
  <g fill="#eaf3ff" filter="url(#soft)">
    <circle r="2"><animate attributeName="cx" values="150;210" dur="10s" repeatCount="indefinite"/><animate attributeName="cy" values="170;40" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle r="1.6"><animate attributeName="cx" values="380;440" dur="12s" begin="-4s" repeatCount="indefinite"/><animate attributeName="cy" values="172;50" dur="12s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="12s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle r="2.2"><animate attributeName="cx" values="580;650" dur="11s" begin="-7s" repeatCount="indefinite"/><animate attributeName="cy" values="174;36" dur="11s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="11s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle r="1.8"><animate attributeName="cx" values="760;820" dur="13s" begin="-2s" repeatCount="indefinite"/><animate attributeName="cy" values="170;60" dur="13s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="13s" begin="-2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- text -->
  <text x="450" y="76" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Georgia,'Times New Roman',serif" font-size="30" letter-spacing="3" fill="url(#txt)" filter="url(#glow)">Thanks for stopping by
    <animate attributeName="opacity" values="0.85;1;0.85" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="450" y="104" text-anchor="middle" font-family="'Palatino Linotype','Book Antiqua',Georgia,serif" font-style="italic" font-size="15" letter-spacing="3" fill="#f3e9ee" fill-opacity="0.85">see you on the next adventure</text>
</svg>